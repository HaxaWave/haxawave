# The mainline MSM8916 audio stack is unstable on this device and is not needed for modem work:
#  - mbhc_btn_press_irq_handler [snd_soc_msm8916_analog] oopses (reboot)
#  - q6asm-dai floods the kernel log with "not expecting rsp"
#  - audio subdevices crash rproc_stop_subdevices on remoteproc stop/start
# Blacklisting these modules gives a stable system and a ~45 s boot.
# Needed only when the modem firmware is switched while the phone runs (remoteproc restart). If the phone boots
# straight into the custom firmware (qcom-sdr-modem-fw.service enabled), delete this file: sound then works normally.
blacklist snd_soc_msm8916_analog
blacklist snd_soc_msm8916_digital
blacklist snd_soc_apq8016_sbc
blacklist q6asm_dai
blacklist q6voice_dai
blacklist q6afe_dai
blacklist q6routing
